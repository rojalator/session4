[project]
name = "session4"
version = "4.0a1"
description = "Persistent sessions for Quixote 4"
readme = "README.md"
authors = [
    { name = "R J Ladyman", email = "it@file-away.co.uk" }
]
license = "MIT"
classifiers=[
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Session"
]
requires-python = ">=3.13"

[project.urls]
Homepage = "http://www.file-away.co.uk/session4/README.html"

[dependency-groups]
dev = [
    "check-manifest>=0.51",
    "make>=0.1.6.post2",
    "pydoctor>=25.10.1",
    "pytest",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "quixote",
    "setuptools",
    "wheel",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["session4*"]

[tool.uv.sources]
quixote = { git = "https://github.com/nascheme/quixote" }

[tool.pytest.ini_options]
testpaths = ["tests"]
